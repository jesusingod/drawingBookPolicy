<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>drawingBook - 구글 드라이브 연결 가이드</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4A90E2; --bg: #F8FAFC; --card: #FFFFFF; --text: #334155; --accent: #FF6B6B; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; line-height: 1.6; }
        .header { background: linear-gradient(135deg, var(--primary), #63B3ED); color: white; padding: 40px 20px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .container { max-width: 800px; margin: -30px auto 50px; padding: 20px; }
        .card { background: var(--card); border-radius: 20px; padding: 30px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); margin-bottom: 30px; }
        h1 { margin: 0; font-size: 24px; }
        h2 { color: var(--primary); font-size: 20px; border-bottom: 2px solid #E2E8F0; padding-bottom: 10px; margin-top: 0; }
        .step { margin-bottom: 40px; position: relative; padding-left: 50px; }
        .step-num { position: absolute; left: 0; top: 0; background: var(--primary); color: white; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px; }
        .tip { background: #FFF5F5; border-left: 4px solid var(--accent); padding: 15px; border-radius: 0 8px 8px 0; font-size: 14px; margin: 20px 0; }
        .footer { text-align: center; color: #94A3B8; font-size: 12px; padding: 40px 0; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📁 Google Drive 가이드</h1>
        <p>우리 아이를 위한 도안 창고 만들기</p>
    </div>
    <div class="container">
        <div class="card">
            <h2>🚀 설정 방법 (2단계)</h2>
            <div class="step">
                <div class="step-num">1</div>
                <h3>드라이브 폴더 공유</h3>
                <p>도안용 폴더를 만들고 <b>[공유 > 링크가 있는 모든 사용자]</b>로 권한을 변경합니다. 폴더 주소를 복사하세요.</p>
            </div>
            <div class="step">
                <div class="step-num">2</div>
                <h3>API 키 발급</h3>
                <p><a href="https://console.cloud.google.com/" target="_blank">Google Cloud Console</a>에서 <b>Google Drive API</b>를 활성화하고 <b>API 키</b>를 생성하여 앱에 입력합니다.</p>
            </div>
            <div class="tip">💡 폴더 내의 이미지는 반드시 JPG 또는 PNG 형식이어야 합니다.</div>
        </div>
        <div class="footer">&copy; 2026 drawingBook Team.</div>
    </div>
</body>
</html>
